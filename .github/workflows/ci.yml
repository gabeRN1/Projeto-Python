name: Testes Automatizados (CI)

on: [push, pull_request]

jobs:
  testes-gerais:
    runs-on: ubuntu-latest
    
    steps:
      - name: Fazer Checkout do Código
        uses: actions/checkout@v4

      - name: Subir containers (Backend + Frontend)
        run: docker compose up -d --build

      - name: Esperar os serviços subirem
        run: sleep 15 

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências de teste
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-django selenium

      - name: Executar Testes do Backend (Pytest)
        run: docker compose exec -T backend pytest tasks/tests_api.py

      - name: Executar Testes do Frontend (Selenium)
        run: |
          cd backend
          python debug_register.py